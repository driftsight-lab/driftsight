# RAGTruth 다운로드·전처리 설정
# 근거: docs/experiments/data.md > 3.1 RAGTruth, docs/experiments/protocol.md > 0.2 데이터 분할

source:
  repo: https://github.com/ParticleMedia/RAGTruth
  # 공식 저장소 커밋 고정 (2024-12-02). 바꾸면 sha256도 함께 갱신한다.
  revision: c103204b9ce28d6bbad859304bf30de72b8ed8fe
  files:
    dataset/response.jsonl: e4c2e4ac24fff676d8984cc61c35d791612fadc58015335d97dd632375e18073
    dataset/source_info.jsonl: 0dffc26ea9f3c1c3d7c7e8336b56ef1646e3cec876edffcca3c9c624d12d578b

split:
  # 공식 train에서 source_id 단위로 dev를 분리한다 (같은 문서의 응답 6개가 갈라지지 않게).
  dev_ratio: 0.1
  seed: 42

labels:
  # E-7-A: LettuceDetect 전처리와 같게 implicit_true 구간도 환각(1)으로 포함한다.
  include_implicit_true: true
  # E-7-B: LettuceDetect 전처리와 같게 quality 플래그로 응답을 거르지 않는다.
  drop_quality: []
